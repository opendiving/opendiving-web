<!-- The OpenDiving brand mark: three rising bubbles, in coral. Original artwork
     for this project, so no third-party notice attaches to it. Kept in step with
     src/components/logo.tsx, which draws the same three circles; the heavier
     stroke here is what keeps the smallest bubble legible at 16px. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#FF7F50" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="6.5" cy="18.5" r="1.6" />
  <circle cx="11.5" cy="12.5" r="2.6" />
  <circle cx="17" cy="5.5" r="3.4" />
</svg>
