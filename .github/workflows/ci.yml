name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run type checking
        run: npm run type-check

      - name: Run tests with coverage
        id: tests
        run: npm run test:coverage

      # Runs whenever the tests step actually executed (pass or fail), but
      # not if it was skipped entirely because an earlier step (lint,
      # type-check) failed first.
      - name: Write coverage summary
        if: always() && steps.tests.outcome != 'skipped'
        run: npm run coverage:summary

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        if: matrix.node-version == '24.x'
        with:
          name: build-files
          path: |
            .next/
            !.next/cache/
          retention-days: 5

  security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=moderate

      - name: Check for outdated packages
        run: npm outdated || true
