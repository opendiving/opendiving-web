name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Both jobs only read: they check out, install, and run npm scripts. `contents: read` is
# what checkout needs and the whole of what they need, and saying so keeps the token off
# whatever the repository default happens to grant. That matters more than it looks -
# linting, testing and building all execute whatever the dependency tree ships, so
# anything the token can do, a compromised transitive dependency can do too.
# `persist-credentials: false` on each checkout is the other half: without it the token is
# left behind in `.git/config`, in the same workspace all of that runs in.
permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run type checking
        run: npm run type-check

      - name: Run tests with coverage
        id: tests
        run: npm run test:coverage

      # Runs whenever the tests step actually executed (pass or fail), but
      # not if it was skipped entirely because an earlier step (lint,
      # type-check) failed first.
      - name: Write coverage summary
        if: always() && steps.tests.outcome != 'skipped'
        run: npm run coverage:summary

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        if: matrix.node-version == '24.x'
        with:
          name: build-files
          path: |
            .next/
            !.next/cache/
          retention-days: 5

  security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=moderate

      - name: Check for outdated packages
        run: npm outdated || true
