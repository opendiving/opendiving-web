name: Code Quality

on:
  push:
    branches:
      - main
  pull_request:

# All three jobs only read: they check out, install, run npm scripts and upload reports as
# artifacts, and `dependency-review` reads the dependency review API, which `contents: read`
# also covers. That is what checkout needs and the whole of what they need, and saying so
# keeps the token off whatever the repository default happens to grant. Every package these
# jobs run comes from `package-lock.json`, never from an `npx --yes` fetch at run time, so the
# code running beside that token is the code the lockfile pinned and nothing newer.
# `persist-credentials: false` on each checkout is the other half - without it the token
# is left behind in `.git/config`, in the same workspace all of that runs in.
#
# A step that wanted to write anything back - a PR comment, a label, a check run - would
# need a job-level block of its own rather than an addition here, since a job-level
# `permissions:` replaces this one instead of merging with it.
permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Runs the npm script rather than repeating its globs. This step and
      # `format:check` in package.json are the same check; with the file list copied
      # into both, extending one silently leaves the other behind.
      #
      # It fails the job, joining ESLint, `tsc --strict` and `npm run build`. Formatting was
      # worth making a gate because the tool that reports the problem also fixes it, so
      # `npm run format` and a push is the whole remedy and no finding is ever arguable.
      # The cost is that this runs first, so the steps below it do not report until it
      # is green.
      - name: Run Prettier check
        run: npm run format:check

      - name: Run ESLint with detailed output
        run: |
          npx eslint . --format=json --output-file=eslint-report.json || true
          npx eslint .

      - name: TypeScript strict check
        run: npx tsc --noEmit --strict

      - name: Build application
        run: npm run build

      - name: Upload ESLint report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eslint-report
          path: eslint-report.json
          retention-days: 30

  # Live again since 2026-09-12, when this repository went public. The action's own README
  # says where it runs: public repositories, and private ones with a GitHub Advanced Security
  # licence. This one was private and had no such licence, so the job sat commented out for
  # as long as that was true and was deleted outright in the pre-publication sweep rather
  # than left as scaffolding. This is that job rebuilt, not uncommented.
  #
  # It answers a question `vulnerability-scan.yml`'s PR job does not. Trivy scans the whole
  # tree a change would ship and fails on a fixable HIGH or CRITICAL wherever it came from;
  # this compares the PR's manifests against the base commit's and reports only what the
  # *change* introduces - which is also the only place a newly added dependency's licence is
  # ever looked at.
  #
  # `fail-on-severity: moderate` is stricter than that Trivy gate deliberately. A moderate
  # advisory arriving with a dependency somebody is adding right now is cheap to decline and
  # expensive to remove a year later, which is not true of one found in a tree already
  # shipped.
  #
  # The licence allow-list is a gate on what a diff *adds*, not an audit of the installed
  # tree, and it is not about compatibility: this project is AGPL-3.0, which every licence
  # below flows into. What it buys is that a licence nobody has looked at arrives as a red
  # check rather than as a line in a lockfile.
  #
  # It was derived rather than copied. The block deleted in the pre-publication sweep named
  # six licences and had never run once; 17 of the 579 packages `npm ci` installs sit outside
  # those six, and `caniuse-lite`, `lru-cache`, `minimatch`, `argparse`, `mdn-data` and
  # `lightningcss` are among them - transitive dependencies of Next.js and Tailwind that move
  # on ordinary bumps, and a *changed* dependency is licence-checked exactly like an added
  # one. Restoring the six verbatim would have made a required check red on a `caniuse-lite`
  # bump, which is a check somebody turns off. So this is the union of those six and every
  # licence the tree already ships. `DECISIONS.md` carries the command that derives it; re-run
  # that before widening this by hand.
  #
  # Pinned on a major tag rather than by SHA because it is GitHub's own action, which is the
  # split the other `actions/*` entries above follow and the SHA-pinned third-party ones in
  # `publish-image.yml` and `vulnerability-scan.yml` do not. `DECISIONS.md` records it under
  # "`pinDigests` is `false`, and that is load-bearing rather than a default"; Renovate renews
  # both styles and would flatten them if that setting moved.
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          allow-licenses: >-
            0BSD, Apache-2.0, BSD-2-Clause, BSD-3-Clause, BlueOak-1.0.0, CC0-1.0,
            CC-BY-3.0, CC-BY-4.0, ISC, LGPL-3.0-or-later, MIT, MIT-0, MPL-2.0, Python-2.0
          # json-schema declares `(AFL-2.1 OR BSD-3-Clause)`; GitHub's dependency graph
          # reads it as an AND of three licenses. Taken under BSD-3-Clause.
          allow-dependencies-licenses: pkg:npm/json-schema@0.4.0

  accessibility-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Start application
        run: npm start &
        env:
          PORT: 3000

      - name: Wait for application to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:3000; do sleep 2; done'

      # A report, not a gate: the script exits non-zero only when it could not scan, so a
      # page with violations stays green and a broken scan goes red. It drives the runner
      # image's Google Chrome, so no browser is downloaded.
      - name: Run accessibility tests with axe
        run: node scripts/axe-report.mjs http://localhost:3000 accessibility-report.json

      - name: Upload accessibility report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: accessibility-report
          path: accessibility-report.json
          retention-days: 30
