name: Code Quality

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Runs the npm script rather than repeating its globs. This step and
      # `format:check` in package.json are the same check; with the file list copied
      # into both, extending one silently leaves the other behind.
      - name: Run Prettier check
        run: npm run format:check
        continue-on-error: true

      - name: Run ESLint with detailed output
        run: |
          npx eslint . --format=json --output-file=eslint-report.json || true
          npx eslint .

      - name: TypeScript strict check
        run: npx tsc --noEmit --strict

      - name: Check for unused dependencies
        run: npx --yes depcheck@1.4.7 --ignores="@types/*,eslint-config-*" || true

      - name: Bundle size analysis
        run: |
          npm run build
          npx --yes @next/bundle-analyzer@16.3.0 || true

      - name: Check for circular dependencies
        run: npx --yes madge@8.0.0 --circular --extensions ts,tsx,js,jsx src/ || true

      # - name: Security scan with Snyk
      #   uses: snyk/actions/node@master
      #   continue-on-error: true
      #   env:
      #     SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      #   with:
      #     args: --severity-threshold=high

      - name: Upload ESLint report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eslint-report
          path: eslint-report.json
          retention-days: 30

