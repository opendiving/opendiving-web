name: Code Quality

on:
  push:
    branches:
      - main
  pull_request:

# Both jobs only read: they check out, install, run npm scripts and upload reports as
# artifacts. `contents: read` is what checkout needs and the whole of what they need, and
# saying so keeps the token off whatever the repository default happens to grant. This
# workflow has more reason to care than most: on top of the dependency tree it executes
# while linting, building and testing, four of its steps are `npx --yes` fetching a tool
# at run time, so the code running beside that token is not the code the lockfile pinned.
# `persist-credentials: false` on each checkout is the other half - without it the token
# is left behind in `.git/config`, in the same workspace all of that runs in.
#
# A step that wanted to write anything back - a PR comment, a label, a check run - would
# need a job-level block of its own rather than an addition here, since a job-level
# `permissions:` replaces this one instead of merging with it.
permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Runs the npm script rather than repeating its globs. This step and
      # `format:check` in package.json are the same check; with the file list copied
      # into both, extending one silently leaves the other behind.
      #
      # It fails the job, joining ESLint, `tsc --strict` and the `npm run build` inside
      # the bundle-size step. Of the advisory checks this job had, depcheck and madge
      # remain - both `|| true`, where this one was `continue-on-error`. Formatting was
      # the one worth promoting: the tool that reports the problem also fixes it, so
      # `npm run format` and a push is the whole remedy and no finding is ever arguable.
      # The cost is that this runs first, so the steps below it do not report until it
      # is green.
      - name: Run Prettier check
        run: npm run format:check

      - name: Run ESLint with detailed output
        run: |
          npx eslint . --format=json --output-file=eslint-report.json || true
          npx eslint .

      - name: TypeScript strict check
        run: npx tsc --noEmit --strict

      - name: Check for unused dependencies
        run: npx --yes depcheck@1.4.7 --ignores="@types/*,eslint-config-*" || true

      - name: Bundle size analysis
        run: |
          npm run build
          npx --yes @next/bundle-analyzer@16.3.0 || true

      - name: Check for circular dependencies
        run: npx --yes madge@8.0.0 --circular --extensions ts,tsx,js,jsx src/ || true

      - name: Upload ESLint report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eslint-report
          path: eslint-report.json
          retention-days: 30

  accessibility-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Start application
        run: npm start &
        env:
          PORT: 3000

      - name: Wait for application to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:3000; do sleep 2; done'

      - name: Run accessibility tests with axe
        run: |
          npx --yes @axe-core/cli@4.12.1 http://localhost:3000 \
            --include="main" \
            --exclude="iframe" \
            --tags="wcag2a,wcag2aa,wcag21aa" \
            --reporter=json \
            --output-file=accessibility-report.json || true

      - name: Upload accessibility report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: accessibility-report
          path: accessibility-report.json
          retention-days: 30
